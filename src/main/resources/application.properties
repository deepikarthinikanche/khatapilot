spring.application.name=KhataPilot
# All data in this app is SAMPLE DATA ONLY (no real names, phones or addresses).
# Embedded in-memory H2 database; no paid services, no external database.
spring.datasource.url=jdbc:h2:mem:khatapilot;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
server.port=${PORT:8080}
