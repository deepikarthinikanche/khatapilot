<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Recurring Bills')}"></head>
<body class="bg-light">
<div th:replace="~{layout :: nav}"></div>
<main class="container pb-5">
    <div th:replace="~{layout :: flash}"></div>

    <div class="card shadow-sm mb-4"><div class="card-body">
        <h1 class="h4 card-title">Recurring bills</h1>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Name</th><th class="text-end">Amount</th><th>Day of month</th><th>Grace days</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="bill : ${bills}">
                    <td th:text="${bill.name}">Rent</td>
                    <td class="text-end" th:text="${@inr.format(bill.amount)}">₹0.00</td>
                    <td th:text="${bill.dayOfMonth}">1</td>
                    <td th:text="${bill.graceDays}">0</td>
                    <td class="text-end">
                        <form method="post" th:action="@{/bills/{id}/delete(id=${bill.id})}" class="d-inline"
                              onsubmit="return confirm('Delete this recurring bill?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bills)}"><td colspan="5" class="text-muted">No recurring bills yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div></div>

    <div class="card shadow-sm"><div class="card-body">
        <h2 class="h5 card-title">Add recurring bill</h2>
        <form method="post" th:action="@{/bills}" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label" for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="amount">Amount (₹)</label>
                <input type="number" class="form-control" id="amount" name="amount" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="dayOfMonth">Day of month</label>
                <input type="number" class="form-control" id="dayOfMonth" name="dayOfMonth" min="1" max="31" required>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="graceDays">Grace days</label>
                <input type="number" class="form-control" id="graceDays" name="graceDays" min="0" value="0" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
        </form>
    </div></div>
</main>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
