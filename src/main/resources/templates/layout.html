<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | KhataPilot'">KhataPilot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* Responsive (mobile, ~390px) overrides. Markup, IDs and Chart.js config are unchanged. */
        @media (max-width: 600px) {
            *, *::before, *::after { box-sizing: border-box; }
            html, body { max-width: 100%; }
            body { overflow-x: hidden; }
            main.container, .container { max-width: 100%; padding-left: 12px; padding-right: 12px; }

            /* Navbar: let links wrap onto several lines instead of stacking or overflowing */
            nav.navbar > .container { flex-wrap: wrap; }
            nav.navbar .navbar-nav { flex-direction: row; flex-wrap: wrap; gap: 0.25rem 0.75rem; max-width: 100%; }
            nav.navbar .nav-link { padding-left: 0; padding-right: 0; }

            /* Risk banner: text and button wrap */
            .alert.d-flex { flex-wrap: wrap; }
            .alert.d-flex > span { min-width: 0; flex: 1 1 100%; overflow-wrap: anywhere; word-break: break-word; }
            .alert.d-flex > .btn { width: 100%; white-space: normal; }

            /* Cards and charts: never wider than the viewport */
            .card, .card-body { min-width: 0; max-width: 100%; }
            .card-title { overflow-wrap: anywhere; }
            #trendChart, #statusChart, #forecastChart { max-width: 100%; }
            canvas { max-width: 100%; }

            /* Rescue plan cards: one column */
            #rescue-plan .row > [class*="col-"] { flex: 0 0 100%; width: 100%; max-width: 100%; }
            #rescue-plan .border.rounded { width: 100%; box-sizing: border-box; overflow-wrap: anywhere; }

            /* KPI cards: two columns on phones (col-6 already); keep them from overflowing */
            .row.g-3 > [class*="col-"] { max-width: 100%; }
            .card-body .fs-4, .card-body .fs-5 { overflow-wrap: anywhere; }

            /* Tables: scroll inside themselves, never widen the page */
            .table-responsive { max-width: 100%; overflow-x: auto; }
            table { display: block; overflow-x: auto; max-width: 100%; }
        }
    </style>

</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">KhataPilot</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/invoices">Invoices</a>
            <a class="nav-link" href="/students">Students</a>
            <a class="nav-link" href="/bills">Bills</a>
            <a class="nav-link" href="/backtest">Backtest</a>
        </div>
    </div>
</nav>
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</th:block>
</body>
</html>
